name: 라라스윗 광고 데이터 백필

on:
  workflow_dispatch:
    inputs:
      since:
        description: '시작일 (YYYY-MM-DD, 예: 2026-01-01)'
        required: true
      until:
        description: '종료일 (YYYY-MM-DD, 예: 2026-05-31)'
        required: true

# 데이터를 커밋하는 워크플로우끼리 순차 실행 (서로 겹쳐서 push 충돌나는 것 방지)
concurrency:
  group: lalasweet-git
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BACKFILL_SINCE: "${{ github.event.inputs.since }}"
      BACKFILL_UNTIL: "${{ github.event.inputs.until }}"
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests pandas gspread google-auth

      - name: 기존 raw CSV 삭제
        run: git rm -f --ignore-unmatch data/meta_raw_*.csv data/tiktok_raw_*.csv || true

      - name: 메타 데이터 수집 (백필)
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          SLACK_BOT_TOKEN: "${{ secrets.SLACK_BOT_TOKEN }}"
          SLACK_USER_ID: "${{ secrets.SLACK_USER_ID }}"
        run: python scripts/meta_api.py

      - name: 틱톡 데이터 수집 (백필)
        env:
          TIKTOK_ACCESS_TOKEN: "${{ secrets.TIKTOK_ACCESS_TOKEN }}"
          TIKTOK_ADVERTISER_ID: "${{ secrets.TIKTOK_ADVERTISER_ID }}"
          SLACK_BOT_TOKEN: "${{ secrets.SLACK_BOT_TOKEN }}"
          SLACK_USER_ID: "${{ secrets.SLACK_USER_ID }}"
        run: python scripts/tiktok_api.py

      - name: 통합 RD 빌드
        run: python scripts/build_rd.py

      - name: Google Sheets 동기화
        env:
          SPREADSHEET_ID: "${{ secrets.SPREADSHEET_ID }}"
          GCP_SERVICE_ACCOUNT_JSON: "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}"
        run: python scripts/sync_to_sheets.py

      - name: 데이터 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "변경 없음 -> 푸시 생략" && exit 0
          MSG="백필: ${{ github.event.inputs.since }} ~ ${{ github.event.inputs.until }}"
          git commit -m "$MSG"

          # 푸시 중 원격에 다른 커밋이 올라오면(다른 워크플로우/웹 수정) 재시도.
          # data/ 는 매 실행마다 새로 생성되는 산출물이라 rebase 병합이 불가능하므로
          # (같은 파일을 한쪽은 삭제, 한쪽은 수정 -> modify/delete 충돌)
          # 원격 최신 커밋 위에 이번 실행 결과를 그대로 다시 얹는다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "푸시 성공 (시도 $i)"
              exit 0
            fi
            echo "푸시 거부됨 -> 원격 최신 위에 결과 재적용 ($i/5)"
            git fetch origin || { echo "fetch 실패"; exit 1; }
            git reset --soft origin/main
            git add -A data/
            if git diff --cached --quiet; then
              echo "원격과 동일 -> 푸시 불필요"
              exit 0
            fi
            git commit -m "$MSG"
            sleep $((i * 3))
          done
          echo "5회 재시도 후에도 푸시 실패"
          exit 1
